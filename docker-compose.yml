version: '3.8'

services:
  java_app:
    build: 
      context: .
    container_name: "expenses-app"
    networks:
      - expense-app-nw
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql_db:3306/expenses_tracker?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      SPRING_DATASOURCE_PASSWORD: Test@123
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql_db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  mysql_db:
    image: mysql:latest
    container_name: "mysql"
    networks:
      - expense-app-nw
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: Test@123
      MYSQL_DATABASE: expenses_tracker
    restart: always
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost" , "-uroot" , "-pTest@123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s


networks:
  expense-app-nw:

volumes:
  mysql_data: